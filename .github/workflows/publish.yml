# Publishes the npm package when a version tag (v0.2.1, v0.3.0...) is pushed.
# No token: npm trusts this workflow through OIDC (npmjs.com > noroles > Settings > Trusted publisher).
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: git config --global user.email ci@noroles.com && git config --global user.name "NoRoles CI"
      - run: npm test
      - run: npm publish --access public
