name: Test

on:
  push:
    branches: [main]
    paths: ['npm/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: git config --global user.email ci@noroles.com && git config --global user.name "NoRoles CI"
      - run: npm test
